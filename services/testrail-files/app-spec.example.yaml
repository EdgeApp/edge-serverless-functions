name: edge-testrail-files
region: sfo
services:
  - name: bridge
    github:
      repo: EdgeApp/edge-serverless-functions
      branch: main
      deploy_on_push: true
    source_dir: services/testrail-files
    dockerfile_path: services/testrail-files/Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
    routes:
      - path: /
    health_check:
      http_path: /health
    envs:
      - key: TESTRAIL_BASE_URL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: TESTRAIL_USER_EMAIL
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: TESTRAIL_API_KEY
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
      - key: TESTRAIL_BRIDGE_SECRET
        scope: RUN_TIME
        type: SECRET
        value: REPLACE_ME
